- name: Configurar servidor con Nginx
  hosts: webservers
  become: yes
  tasks:
    - name: Actualizar paquetes
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Instalar Nginx
      apt:
        name: nginx
        state: present
      when: ansible_os_family == "Debian"

    - name: Asegurar que Nginx esté activo
      service:
        name: nginx
        state: started
        enabled: true

    - name: Instalar Java (OpenJDK 21) y dependencias de Jenkins
      apt:
        name:
          - openjdk-21-jre
          - fontconfig
        state: present
      when: ansible_os_family == "Debian"

    - name: Asegurar directorio de keyrings de apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Descargar clave GPG de Jenkins
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Agregar repositorio LTS de Jenkins
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/\n"
        mode: "0644"

    - name: Instalar Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Asegurar que Jenkins esté activo
      service:
        name: jenkins
        state: started
        enabled: true
